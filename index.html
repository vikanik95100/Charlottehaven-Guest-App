<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Charlottehaven Guest App</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Encode+Sans+Condensed:wght@300;400;500;600;700;800&family=Source+Sans+3:wght@300;400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#24151A;--bg:#F5F2EF;--sand:#F0B65A;--gold:#7B1628;--lsand:#EBC4C9;--paper:#FFFFFF;--warm:#CC4B37;--ice:#2F7F8F;--mut:rgba(36,21,26,.62);--line:rgba(123,22,40,.2);--c:"Source Sans 3",system-ui,sans-serif;--f:"Encode Sans Condensed","Arial Narrow",sans-serif;--s:1}
html,body{height:100%}
body{font-family:var(--c);background:#E6E1DC;color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
.top{height:62px;display:flex;align-items:center;gap:14px;padding:0 24px;background:var(--ink);color:#fff}
.top img{height:36px;display:block}
.top small{font-size:13.5px;color:rgba(255,255,255,.6)}
.sp{flex:1}
.tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:5px 12px;font-weight:600}
.tag.hot{background:var(--sand);color:var(--ink);border-color:var(--sand);font-weight:700}
.tag[aria-pressed=true]{background:#fff;color:var(--ink)}
.layout{display:grid;grid-template-columns:236px 1fr 340px;height:calc(100% - 62px)}
body[data-notes=off] .layout{grid-template-columns:236px 1fr 0}body[data-notes=off] .notes{display:none}
.rail{padding:22px 16px;overflow:auto;border-right:1px solid rgba(123,22,40,.22);background:#EFEAE6}
.rg{margin-bottom:20px}.rg .eb{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);padding:0 10px 8px;font-weight:700}
.ri{display:flex;gap:11px;align-items:center;width:100%;padding:9px 10px;border-radius:10px;font-size:15.5px;font-weight:500;color:#3e2b31}
.ri .n{font-size:12px;color:#9d8f92;width:18px;font-variant-numeric:tabular-nums}
.ri:hover{background:rgba(36,21,26,.05)}
.ri[aria-current=true]{background:var(--ink);color:#fff}.ri[aria-current=true] .n{color:rgba(255,255,255,.55)}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(900px 620px at 50% 38%,#FFFFFF,#E9E4E0)}
.pw{width:calc(390px*var(--s));height:calc(844px*var(--s));position:relative;flex:none}
.phone{width:390px;height:844px;border-radius:56px;position:absolute;top:0;left:0;transform-origin:0 0;transform:scale(var(--s));background:#000;box-shadow:0 0 0 10px #1b0d11,0 0 0 11.5px var(--sand),0 60px 90px -25px rgba(36,21,26,.55)}
.screen{position:absolute;inset:0;border-radius:56px;overflow:hidden;background:var(--bg);color:var(--ink);isolation:isolate}
.hint{display:flex;gap:10px;align-items:center;margin-top:16px;font-size:14px;color:#6a5a5e}
.hint button{border:1.5px solid var(--ink);border-radius:99px;padding:5px 14px;font-size:14px;font-weight:600;background:#fff}.hint button:disabled{opacity:.3}
.notes{padding:26px 26px 20px;overflow:auto;border-left:1px solid rgba(123,22,40,.22);background:#EFEAE6}
.notes .eb{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.notes h2{font-family:var(--f);font-weight:300;font-size:38px;margin:6px 0 8px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.notes p.l{font-size:15px;line-height:1.55;color:#503d43}
.notes ul{margin:14px 0 0 18px;font-size:14.5px;line-height:1.55;color:#2a161c}.notes li{margin-bottom:8px}
.why{margin-top:18px;padding:14px 16px;border-radius:14px;background:#fff;border:1px solid var(--sand);box-shadow:3px 3px 0 var(--lsand)}
.why p{font-size:14.5px;line-height:1.5;margin-top:4px}
.foot{font-size:12.5px;line-height:1.55;color:#8a7c7f;margin-top:20px}
.sbar{position:absolute;top:0;left:0;right:0;height:56px;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:8px 36px 0 40px;font-weight:600;font-size:16px;pointer-events:none;color:var(--ink);transition:color .3s}
.screen[data-th=dark] .sbar{color:#fff}
.sbar i{display:inline-block;width:17px;height:11px;border-radius:3px;border:1.5px solid currentColor;margin-left:6px;position:relative;opacity:.9}
.sbar i:after{content:"";position:absolute;inset:1.5px;background:currentColor;border-radius:1px;width:60%}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:36px;border-radius:22px;background:#000;z-index:70;transition:width .55s cubic-bezier(.2,.9,.25,1.05),height .55s cubic-bezier(.2,.9,.25,1.05);overflow:hidden;cursor:pointer;color:#fff}
.island .in{opacity:0;transition:opacity .25s;display:flex;align-items:center;gap:12px;padding:13px 18px;white-space:nowrap}
.island.open{width:358px;height:80px;border-radius:40px}.island.open .in{opacity:1;transition-delay:.2s}
.island .ico{width:42px;height:42px;border-radius:50%;background:var(--sand);color:var(--ink);display:grid;place-items:center;flex:none}
.island b{font-size:16px;font-weight:700;display:block}.island span.s{font-size:13px;color:rgba(255,255,255,.62)}
.island .t{margin-left:auto;font-family:var(--f);font-weight:300;font-size:32px;color:var(--lsand)}
.view{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateY(16px) scale(.985);transition:opacity .4s,transform .55s cubic-bezier(.2,.8,.2,1),visibility 0s .4s;background:var(--bg)}
.view.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.view.dk{background:var(--ink);color:#fff}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:64px 0 132px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.pad{padding:0 20px}
.rv{opacity:0}.on .rv{animation:up .75s both cubic-bezier(.2,.8,.2,1);animation-delay:calc(var(--d,0)*65ms + 100ms)}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.hd{font-family:var(--f);font-weight:300;text-transform:uppercase;letter-spacing:.01em;line-height:.92}
.hd b{font-weight:800}
.h2{font-family:var(--f);font-weight:300;font-size:30px;text-transform:uppercase;line-height:1}
.h2 b{font-weight:800}
.h3{font-weight:700;font-size:16px;line-height:1.2}
.m{font-size:13.5px;color:var(--mut);line-height:1.45}
.p{font-size:15.5px;line-height:1.55}
.stk{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:var(--sand);color:var(--ink);font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.stk.d{background:var(--ink);color:#fff}.stk.w{background:rgba(255,255,255,.92);color:var(--ink)}.stk.o{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 1px var(--sand)}.stk.gl{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(8px)}.stk.warm{background:var(--warm);color:#fff}.stk.ice{background:var(--ice);color:#06222c}
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;position:relative;overflow:hidden;box-shadow:0 14px 30px -22px rgba(36,21,26,.5)}
.ph{background-size:cover;background-position:center;background-color:#d3c4c6;position:relative}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,12,16,.42) 0%,rgba(26,12,16,0) 34%,rgba(26,12,16,.12) 55%,rgba(26,12,16,.88) 100%)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:56px;border-radius:99px;font-family:var(--f);font-weight:600;font-size:16px;letter-spacing:.14em;text-transform:uppercase;transition:transform .15s;background:var(--ink);color:#fff}
.btn:active{transform:scale(.97)}
.btn.sand{background:var(--sand);color:var(--ink)}.btn.w{background:#fff;color:var(--ink)}.btn.o{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--sand)}.btn.sm{height:46px;font-size:14px}.btn.warm{background:var(--warm);color:#fff}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);backdrop-filter:blur(8px)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px var(--sand);white-space:nowrap;background:transparent;transition:all .2s}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;box-shadow:none}
.chip:disabled{opacity:.3}
.row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:0 20px;scroll-snap-type:x proximity}.row::-webkit-scrollbar{display:none}
.tabbar{position:absolute;left:14px;right:14px;bottom:18px;height:72px;border-radius:36px;z-index:50;display:flex;align-items:center;justify-content:space-around;padding:0 10px;background:rgba(36,21,26,.8);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 18px 36px -10px rgba(26,12,16,.6),inset 0 0 0 1px rgba(235,196,201,.3);transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .3s}
.screen[data-tb=off] .tabbar{transform:translateY(130px);opacity:0;pointer-events:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f);font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6);padding:8px 8px;min-width:56px;transition:color .2s}
.tab[aria-current=true]{color:var(--lsand)}
.tab.kf{width:64px;height:64px;min-width:64px;border-radius:50%;background:linear-gradient(135deg,#f6d3d8,#C9606F 60%,#7B1628);color:var(--ink);margin-top:-30px;border:4px solid var(--bg);justify-content:center;box-shadow:0 10px 24px -6px rgba(123,22,40,.8);padding:0}
.bar{display:flex;align-items:center;gap:12px;padding:0 20px 14px}
.back{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:#fff;color:var(--ink);box-shadow:0 4px 14px -4px rgba(36,21,26,.4)}
.back.glass{background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.dk .back{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:24px;padding:16px;position:relative;overflow:hidden;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;border:1px solid var(--line);background:var(--paper)}
.big{font-family:var(--f);font-weight:300;font-size:46px;letter-spacing:-.01em;line-height:.95}.big small{font-size:.38em;letter-spacing:0;margin-left:3px;color:var(--mut);font-weight:400}
.pulse{width:9px;height:9px;border-radius:50%;background:#3DBE86;position:relative;display:inline-block;flex:none}
.pulse:after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid #3DBE86;animation:pl 1.8s infinite}
@keyframes pl{from{transform:scale(.4);opacity:1}to{transform:scale(1.7);opacity:0}}
.mq{overflow:hidden;white-space:nowrap;font-family:var(--f);font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:13px}
.mq div{display:inline-block;animation:mq 30s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:55;border-radius:30px 30px 0 0;padding:10px 20px 32px;transform:translateY(105%);transition:transform .6s cubic-bezier(.2,.85,.25,1);background:var(--paper);box-shadow:0 -24px 50px rgba(26,12,16,.45);color:var(--ink);max-height:92%;overflow-y:auto;scrollbar-width:none}
.sheet.on{transform:none}.sheet .grab{width:48px;height:5px;border-radius:3px;background:var(--sand);margin:0 auto 16px}
.scrim{position:absolute;inset:0;z-index:54;background:rgba(26,12,16,.5);opacity:0;pointer-events:none;transition:opacity .4s}.scrim.on{opacity:1;pointer-events:auto}
.stepper{display:flex;align-items:center;gap:14px}.stepper button{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--sand);font-size:22px;font-weight:500;display:grid;place-items:center}
.stepper b{font-family:var(--f);font-size:32px;font-weight:300;min-width:26px;text-align:center}
.kv{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;gap:14px}.kv:last-child{border:0}.kv span:first-child{color:var(--mut)}.kv span:last-child{text-align:right;font-weight:700}
.msg{max-width:84%;padding:11px 16px;border-radius:20px;font-size:15.5px;line-height:1.45;animation:up .5s both}
.msg.in{background:#fff;border-bottom-left-radius:6px;align-self:flex-start;box-shadow:0 4px 14px -8px rgba(36,21,26,.5)}
.msg.out{background:var(--ink);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.msg small{display:block;font-size:11.5px;opacity:.5;margin-top:5px}
.msg .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.msg .acts button{font-size:13.5px;font-weight:700;padding:7px 14px;border-radius:99px;background:var(--sand)}
.typing{display:flex;gap:4px;padding:15px 16px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink);opacity:.4;animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.2}30%{opacity:.9}}
.toast{position:absolute;left:50%;bottom:116px;transform:translate(-50%,20px);z-index:80;padding:12px 20px;border-radius:99px;font-size:14.5px;font-weight:600;opacity:0;transition:all .4s cubic-bezier(.2,.8,.2,1);white-space:nowrap;background:var(--ink);color:#fff;box-shadow:0 0 0 1.5px var(--sand)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.kenb{position:absolute;inset:-6%;background-size:cover;background-position:50% 50%;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.16) translate(-2%,-1%)}}
.keybtn{position:relative;width:112px;height:112px;border-radius:50%;background:linear-gradient(135deg,#f6d3d8,#C9606F 55%,#7B1628);color:var(--ink);display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .2s,background .3s;flex:none;box-shadow:0 10px 24px -8px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.3)}
.keybtn:active{transform:scale(.95)}.keybtn.ok{background:#2f9e6c;color:#fff}
.keybtn svg.rg{position:absolute;inset:-12px;width:136px;height:136px;transform:rotate(-90deg)}
.keybtn .rp{position:absolute;inset:0;border-radius:50%;border:2px solid #fff;opacity:0}.keybtn.ok .rp{animation:rip 1.2s infinite}
@keyframes rip{from{transform:scale(1);opacity:.8}to{transform:scale(1.9);opacity:0}}
.chk{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--sand);display:grid;place-items:center;flex:none;transition:all .25s;color:transparent;background:#fff}
.chk.on{background:var(--ink);color:var(--lsand);box-shadow:none}
.seg{display:flex;background:#ECE6E1;border-radius:99px;padding:4px;gap:2px}.seg button{flex:1;text-align:center;padding:9px 6px;border-radius:99px;font-weight:700;font-size:13.5px;transition:all .2s;color:var(--mut)}.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.toggle{width:52px;height:30px;border-radius:99px;background:rgba(36,21,26,.2);position:relative;transition:background .25s;flex:none}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.toggle[aria-pressed=true]{background:#2f9e6c}.toggle[aria-pressed=true]:after{transform:translateX(22px)}
.pass{background:linear-gradient(160deg,#3e0b14,var(--ink) 60%,#14080b);color:#fff;border-radius:30px;position:relative;box-shadow:0 22px 40px -18px rgba(36,21,26,.85)}
.pass:before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:linear-gradient(90deg,var(--sand),#e9dede,var(--sand));border-radius:30px 30px 0 0}
.perf{position:relative;height:0;border-top:2px dashed rgba(255,255,255,.25);margin:0 22px}
.perf:before,.perf:after{content:"";position:absolute;top:-15px;width:28px;height:28px;border-radius:50%;background:var(--bg)}
.perf:before{left:-36px}.perf:after{right:-36px}
.fld .l{font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.6;font-weight:700}.fld .v{font-family:var(--f);font-weight:500;font-size:19px;margin-top:2px}
.gl{backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.heat{display:flex;gap:5px}.heat i{width:28px;height:8px;border-radius:4px;background:rgba(255,255,255,.2);transition:background .5s}.heat i.on{background:linear-gradient(90deg,#f0b46a,var(--warm))}
.heat.ice i.on{background:linear-gradient(90deg,#bfe6f2,var(--ice))}
.vapor{position:absolute;left:0;right:0;bottom:0;height:60%;background:radial-gradient(60% 80% at 30% 100%,rgba(255,255,255,.25),transparent),radial-gradient(50% 70% at 75% 100%,rgba(255,255,255,.2),transparent);animation:vp 7s ease-in-out infinite alternate;pointer-events:none}
@keyframes vp{from{transform:translateY(8%) scale(1);opacity:.6}to{transform:translateY(-6%) scale(1.15);opacity:1}}
.breath{position:relative;width:250px;height:250px;margin:0 auto;display:grid;place-items:center}
.breath .o,.breath .m2,.breath .c{position:absolute;border-radius:50%}
.breath .o{inset:0;border:1.5px solid rgba(255,255,255,.35)}
.breath .m2{inset:30px;border:1px solid rgba(255,255,255,.2)}
.breath .c{width:120px;height:120px;background:radial-gradient(circle at 35% 30%,#efe6e6,var(--sand) 65%,#7e7050);box-shadow:0 0 60px rgba(235,196,201,.55);transition:transform 4s cubic-bezier(.45,0,.55,1)}
.breath.in .c{transform:scale(1.75)}.breath.hold .c{transform:scale(1.75);transition-duration:.2s}.breath.out .c{transform:scale(1);transition-duration:8s}
@media(max-width:1080px){.layout{grid-template-columns:200px 1fr 0}.notes{display:none}}

var NOTES={
welcome:["Arrival","Welcome","Charlottehaven, the apartment hotel in Østerbro with a Health Club, a café and a garden under the same roof, in its own colours: burgundy, warm wood and soft winter light.",["Real: the CH monogram, the line &lsquo;More than just a hotel&rsquo; and every photo come from charlottehaven.com.","A ticker with what guests pick the hotel for: apartments and suites, The Tower and The Garden, pool and sauna, café, pets welcome, 300 metres to Nordhavn Station.","The site is in Danish and English; the app would follow the guest&rsquo;s language."],"The first screen should sell the place and give one clear next step, not ask for a login."],
home:["Arrival","Today & key card","Arrival day as a key card with a hold-to-unlock button (try it), then tonight&rsquo;s table, the Health Club and the weekend&rsquo;s Advent brunch.",["Real: the reception is open 05:30 to 23:00 on weekdays and 07:00 to 23:00 on weekends; the Health Club is open until 23:00 on weekdays; the café serves dinner until 20:00 Monday to Friday; the Advent brunch is on Sunday 6 December.","Placeholders: apartment number, guest, weather. Check-in and check-out times are not on the site.","The pill at the top is a Live Activity for tonight&rsquo;s table (tap it)."],"The reception, café and Health Club each have their own phone number today. Today puts them on one screen, so the front desk answers the same questions less often."],
apt:["Arrival","Apartment & upgrades","A Garden apartment with the key on the phone, and the next categories up.",["Real: apartments with a living room, separate bedrooms, a fully equipped kitchen and a spacious balcony, three times the size of a standard hotel room; weekly cleaning and linen change; free Wi-Fi; cargo bike rental at DKK 500 a day; pets at DKK 500 a pet.","Real: the Penthouse Two-Bed 105 m&sup2; (The Garden, 6th floor, city and harbour views) and the Family Two-Bed Hotel Suite 70 m&sup2; (The Tower, floors 1 to 4, Danish design from HAY, &amp;tradition, Gubi and Arne Jacobsen).","Placeholder: rates are not published on the site (they show in the booking engine), so the upgrade cards say so. The apartment number and the key are placeholders."],"A guest who can open the door, rent a bike and see the next category up without calling is a guest who books the bigger apartment next time."],
roof:["Daylight & city","Daylight & roof terraces","Drag the clock through a short December day, then pick what to do before dark.",["Real: The Tower has roof terraces on the 5th and 16th floors, included for guests; the Kastellet ramparts are open 06:00 to 20:00 in the winter season; five running routes of 5 to 10 km start from the door.","Illustrative: sunrise at about 08:00 and sunset at about 15:40 in early December are approximate; a live version would calculate them per day.","The sauna card opens the Health Club booking sheet."],"In a Nordic winter the day is short, and guests plan around the light. Showing it, and what fits each hour, turns the question &lsquo;what shall we do?&rsquo; into bookings."],
club:["Eat & train","Health Club","The pool, the sauna, the gym and outdoor classes, free for hotel guests, with a booking sheet.",["Real: free access to the pool, fitness and Health Club for guests; a 20 m pool heated to 26&deg;C (swimming cap required); a 70&deg;C sauna and a milder, humid tylarium; Matrix equipment and a free-training area; outdoor classes (Abs &amp; Booty, Bootcamp, Flex n&rsquo; Bend, Heavy Stuff, HIIT, Open Gym); personal training; physiotherapy and massage.","Real: open 05:30 to 23:00 on weekdays and 07:00 to 22:00 on weekends; the pool is closed on Wednesdays 12:00 to 15:00; children from 5 in the pool, 15 and over in the gym; no lifeguard.","Illustrative: class times; the site publishes the timetable in a separate system."],"The Health Club is the hotel&rsquo;s strongest card and it is reached by walking down. Booking from the phone fills classes and treatment slots, and tells the team who is coming."],
cafe:["Eat & train","Café & brunch","Weekday café, weekend brunch, the Advent brunch, the juice bar and takeaway, with a booking sheet that counts the family.",["Real: café Monday to Friday 07:00 to 20:00 (breakfast, lunch and dinner); brunch buffet on weekends and holidays 09:00 to 15:00, kitchen closes 14:30; takeaway Monday to Friday 15:00 to 20:00; juice bar all day.","Real: brunch DKK 295, children 3 to 11 DKK 145, 1 to 2 DKK 50, babies free; Advent brunch on Sunday 6 December with Santa 12:00 to 13:00, children 3 to 11 DKK 185 and gl&oslash;gg DKK 55. The booking sheet adds it up.","Table times are illustrative; today a table is booked on the site or by phone."],"Brunch tables are booked on the site or by phone. A sheet that adds up the family and confirms in one tap saves a call and a no-show."],
explore:["Daylight & city","Out & about","Run, play or wander from the door of the hotel, with a schematic map.",["Real: Nordhavn Station is 300 metres away; five running routes of 5 to 10 km; Kastellet, the Little Mermaid, Fælledparken, the Svanem&oslash;llestranden beach and the Nordhavn harbour bus; for kids Experimentarium (10 min by bike), Konditaget L&uuml;ders (5 min by bike), AirTrix and the Workers&rsquo; Museum.","The map is a schematic, not to scale; distances are the hotel&rsquo;s own.","Cargo bikes can be rented at reception for DKK 500 a day (the button opens the booking sheet)."],"Guests ask what is nearby at the desk all day. The hotel already writes good local guides; the app puts them one tap away."],
hotel:["Stay","Hotel guide","Services, parking, pets, family kit and how the hotel is built, in one place.",["Real: reception hours, parking (about 35 spaces, 24 h ticket DKK 225), three EV charging stations at DKK 3.50 a kWh, dry cleaning and laundry, bike, pram and child-seat rental, pets at DKK 500 a pet with a welcome pack, games and puzzles at reception.","Real: The Tower is geothermal, with 140 m boreholes covering heating and cooling, and surplus energy warms the Garden pool.","The Tower is about 100 metres from The Garden; the site also says 50 metres in one place, so the app would show one."],"The services are spread across many pages today. As tiles with a request button they become something guests use and the team can count."],
chat:["Stay","Concierge chat","An answer bot built on the hotel&rsquo;s own guest information, with the team behind it.",["Try &lsquo;dogs&rsquo;, &lsquo;brunch&rsquo;, &lsquo;pool&rsquo;, &lsquo;parking&rsquo;, &lsquo;kids&rsquo; or &lsquo;bike&rsquo;.","Answers use the real hours, prices and policies from the website.","Anything else goes to the team: +45 3527 1500 or reception@charlottehaven.com."],"The same questions come in every day, and the hotel already has the answers written down. The app gives them in a second."],
checkout:["Stay","Check-out","The folio and a thank-you.",["Placeholder: the apartment rate, since the site shows rates only in its booking engine.","Real: the brunch, bike and other prices on the folio come from the site; other requests show as to be confirmed.","The next stay is one tap away."],"A clear folio and a next-stay offer close the stay well, before the guest has left the hotel."]};

function openBook(k,opt){var a=ACTS[k];var o=opt||0;if(a.opts&&o>=a.opts.length)o=0;S.bk={k:k,o:o,day:0,time:"",g:(k==="late"||k==="club"||k==="bike")?1:2,kids:1};S.bk.day=daysFor(S.bk)[0];S.bk.time=timesFor(S.bk)[0];bookSheet()}
function bookSheet(){var b=S.bk,a=ACTS[b.k];var days=daysFor(b),times=timesFor(b);if(days.indexOf(b.day)<0)b.day=days[0];if(times.indexOf(b.time)<0)b.time=times[0];b.g=Math.min(b.g,maxFor(b));
var title=a.opts?a.opts[b.o]:a.t;var img=IMK[b.k]?(IMK[b.k][b.o]||IMK[b.k][0]):"apt";var pr=priceOf(b);var kidsOn=a.kids&&b.o>0;
openSheet('<div style="display:flex;gap:14px;align-items:center;margin-bottom:14px"><span class="ph" style="width:70px;height:70px;border-radius:18px;flex:none;'+bg(img)+'"></span><div><div class="eyebrow">'+a.sub+'</div><div class="hd" style="font-size:25px;margin-top:3px;line-height:1.05">'+title+'</div></div></div>'+
'<p class="m" style="color:var(--ink);opacity:.8;margin-bottom:14px">'+a.note+'</p>'+
(a.opts?'<div class="row" style="padding:0;margin-bottom:14px">'+a.opts.map(function(o,i){return '<button class="chip" data-bopt="'+i+'" aria-pressed="'+(i===b.o)+'">'+o+'</button>'}).join("")+'</div>':'')+
'<div class="eyebrow" style="margin-bottom:8px">Day</div><div class="row" style="padding:0;margin-bottom:14px">'+DAYS.map(function(d,i){var ok=days.indexOf(i)>-1;return '<button class="chip" data-bday="'+i+'" aria-pressed="'+(i===b.day)+'" '+(ok?'':'disabled')+'>'+d[0]+' '+d[1]+' '+d[2]+'</button>'}).join("")+'</div>'+
(times.length>1?'<div class="eyebrow" style="margin-bottom:8px">Time <span style="text-transform:none;letter-spacing:0;opacity:.6">· illustrative</span></div><div class="row" style="padding:0;margin-bottom:14px">'+times.map(function(t){return '<button class="chip" data-btime="'+t+'" aria-pressed="'+(t===b.time)+'">'+fmtT(t)+'</button>'}).join("")+'</div>':'<div class="eyebrow" style="margin-bottom:6px">Time</div><div style="font-family:var(--f);font-weight:400;font-size:30px;margin-bottom:14px">'+fmtT(b.time)+'</div>')+
(b.k==="late"?'':'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px"><div><div class="h3">'+(b.k==="cafe"?"Adults":"Guests")+'</div><div class="m">'+a.label+'</div></div><div class="stepper"><button data-bg="-1">−</button><b>'+b.g+'</b><button data-bg="1">+</button></div></div>')+
(kidsOn?'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px"><div><div class="h3">Children 3–11</div><div class="m">DKK '+(b.o===2?185:145)+' each · under 3 almost free</div></div><div class="stepper"><button data-bk="-1">−</button><b>'+b.kids+'</b><button data-bk="1">+</button></div></div>':'')+
'<div style="display:flex;align-items:baseline;justify-content:space-between;border-top:1.5px solid var(--ink);padding-top:12px;margin-bottom:14px"><span class="hd" style="font-size:22px">Price</span><span class="big" style="font-size:30px">'+(pr!==null?dkk(pr):b.k==="cafe"?"At the café":b.k==="club"?"By the club":"On request")+'</span></div><button class="btn" id="bconf">'+(b.k==="cafe"?"Confirm booking":"Send request")+'</button>')}
function confirmBook(){var b=S.bk,a=ACTS[b.k];var title=a.opts?a.opts[b.o]:a.t;
if(b.k==="late"){S.plan=S.plan.filter(function(p){return p.k!=="co"&&p.k!=="late"});S.plan.push({k:"late",d:3,m:mins(b.time),t:b.time,title:"Late check-out until "+fmtT(b.time),sub:"Requested · subject to availability",st:"req"});S.fio=S.fio.filter(function(f){return f.k!=="late"});S.fio.push({k:"late",t:"Late check-out until "+fmtT(b.time),p:null,s:"on request"})}
else if(b.k==="cafe"){var lab=b.o===0?"Table at the café":b.o===1?"Weekend brunch":"Advent brunch";if(b.day===0&&b.o===0)S.plan=S.plan.filter(function(p){return p.k!=="d0"});var who=b.g+" adult"+(b.g>1?"s":"")+(b.o>0&&b.kids?" + "+b.kids+" child"+(b.kids>1?"ren":""):"");S.plan.push({k:"c"+b.day+b.o,d:b.day,m:mins(b.time),t:b.time,title:lab,sub:who+" · confirmed",st:"ok"});var pr=priceOf(b);if(pr!==null)S.fio.push({t:lab+" · "+who,p:pr})}
else if(b.k==="bike"){S.plan.push({k:"bk"+b.day,d:b.day,m:mins(b.time),t:b.time,title:"Cargo bike",sub:b.g+" bike · pick up at reception",st:"req"});S.fio.push({t:"Cargo bike · "+b.g+" day",p:500*b.g})}
else{S.plan.push({k:b.k+b.day+b.o,d:b.day,m:mins(b.time),t:b.time,title:title,sub:b.g+" guest"+(b.g>1?"s":"")+" · club confirms",st:"req"});S.fio.push({t:title+" · "+b.g,p:null,s:"to be confirmed"})}
closeSheet();say(b.k==="cafe"?"Booked: "+(b.o===2?"Advent brunch":b.o===1?"weekend brunch":"table at the café"):"Request sent · the team replies here");
if(S.cur==="home"||S.cur==="checkout")setTimeout(function(){go(S.cur)},300)}

[/brunch|weekend/i,"The brunch buffet runs on weekends and holidays from 09:00 to 15:00 (the kitchen closes at 14:30), with an egg station. Adults DKK 295, children 3–11 DKK 145, ages 1–2 DKK 50, babies free. Tables are held for two hours.",[["Book brunch","act:cafe"]]],

[/parking|park\b|car\b|ev\b|charg/i,"We have about 35 spaces in front of the building. A 24-hour ticket for hotel guests is DKK 225, bought on site. Three EV charging stations in the basement cost DKK 3.50 per kWh; use the Monta app.",null],
[/kid|child|baby|family|playground|toddler/i,"Families are well looked after: a playground in the courtyard, games and puzzles to borrow at reception, high chairs, a cot and a children’s menu in the café. The pool welcomes children from 5 with an adult. Experimentarium is 10 minutes by bike, and Konditaget Lüders 5 minutes.",[["Out & about","go:explore"]]],
[/bike|bicycle|cargo|pram|child seat/i,"Rent a cargo bike at reception for DKK 500 a day. Bicycles, prams and child seats are available too.",[["Rent a bike","act:bike"]]],
[/run|jog|route|walk|kastellet|nordhavn|metro|sights?|mermaid|museum|what to do/i,"Five running routes of 5 to 10 km start from the door, including the Nordhavn waterfront, Kastellet and Fælledparken. Nordhavn Station is 300 m away, and the Little Mermaid and Kastellet are a short trip south.",[["Out & about","go:explore"],["Daylight","go:roof"]]],
[/roof|terrace|sunset|sunrise|daylight|view/i,"The Tower has roof terraces on the 5th and 16th floors, open to guests, with views over the city and the harbour.",[["Daylight","go:roof"]]],
[/laundry|washer|dry clean|towel|clean/i,"Every apartment has a washer/dryer. Cleaning and change of towels and linen are weekly; there is also a dry cleaning and laundry service.",null],
[/tower|garden|where/i,"The Garden has the reception, café, Health Club and courtyard. The Tower is about 100 metres away, with its own roof terraces and the 180-degree views.",[["Hotel guide","go:hotel"]]],
[/check.?out|check.?in|arriv|depart|late|luggage|bags|reception/i,"Your check-in and check-out times are on your booking confirmation. The reception is open 05:30 to 23:00 on weekdays and 07:00 to 23:00 on weekends.",[["Late check-out","act:late"]]],
[/wi-?fi|internet|wifi/i,"Free high-speed Wi-Fi is included in every apartment, along with cable TV.",null],
[/human|person|desk|call|phone|concierge|team/i,"Of course. I’ve flagged this to the team. You can also call +45 3527 1500, or write to reception@charlottehaven.com. The café is on +45 3527 1516 and the Health Club on +45 3527 1505.",null]];
function paintMsgs(t){var m=$("#msgs");if(!m)return;m.innerHTML=S.msgs.map(function(x){return '<div class="msg '+x.r+'">'+x.t.replace(/</g,"&lt;")+(x.a?'<div class="acts">'+x.a.map(function(a){return '<button data-x="'+a[1]+'">'+a[0]+'</button>'}).join("")+'</div>':'')+'<small>'+(x.r==="in"?"Charlottehaven · ":"")+x.ts+'</small></div>'}).join("")+(t?'<div class="msg in typing"><i></i><i></i><i></i></div>':'');m.scrollTop=m.scrollHeight}
function ask(q){S.msgs.push({r:"out",t:q,ts:"16:14"});paintMsgs(true);var hit=null;for(var i=0;i<KB.length;i++)if(KB[i][0].test(q)){hit=KB[i];break}
setTimeout(function(){S.msgs.push({r:"in",t:hit?hit[1]:"Good question. I’ve passed it to the team and they’ll reply here shortly. Meanwhile I can help with the café, the Health Club, parking or check-out.",ts:"16:14",a:hit?hit[2]:null});paintMsgs()},850)}
function action(x){var p=x.split(":"),k=p[0],v=p.slice(1).join(":");if(k==="go")go(v);else if(k==="act")openBook(v)}
function rmSheet(i){var r=RM[i];openSheet('<div class="ph" style="height:170px;border-radius:18px;margin-bottom:14px;'+bg(r[1])+'"><div class="shade" style="border-radius:18px"></div><span class="stk w" style="position:absolute;left:12px;top:12px">'+r[2]+'</span></div><div class="hd" style="font-size:26px;line-height:1.05">'+r[0]+'</div><p class="m" style="color:var(--ink);opacity:.8;margin:6px 0 10px">'+r[4]+'</p><div style="margin-bottom:12px"><div class="kv"><span>Sleeps</span><span>'+r[2]+'</span></div><div class="kv"><span>Where</span><span style="font-size:13px;text-align:right">'+r[3]+'</span></div><div class="kv"><span>Rate</span><span style="text-align:right;font-size:13px">Shown in the booking engine</span></div></div><p class="m" style="font-size:11.5px;margin-bottom:12px">The hotel does not publish rates on its site, so none is shown here. A live version would show your upgrade price and availability.</p><button class="btn" data-say="Upgrade enquiry sent · reception replies in the chat">Ask about an upgrade</button>')}

document.addEventListener("click",function(e){var t;
if(t=e.target.closest("[data-x]")){action(t.dataset.x);return}
if(t=e.target.closest("[data-act]")){openBook(t.dataset.act,t.dataset.dr!==undefined?+t.dataset.dr:t.dataset.tr!==undefined?+t.dataset.tr:0);return}
if(t=e.target.closest("[data-go]")){go(t.dataset.go);return}
if(t=e.target.closest("[data-tg]")){var k=t.dataset.tg;S[k]=!S[k];t.setAttribute("aria-pressed",S[k]?"true":"false");if(k==="dnd")say(S.dnd?"Do not disturb on":"Do not disturb off");return}
if(t=e.target.closest("[data-say]")){say(t.dataset.say);return}
if(t=e.target.closest("[data-rm]")){rmSheet(+t.dataset.rm);return}
if(t=e.target.closest("[data-psel]")){S.psel=+t.dataset.psel;var y1=$('[data-v="explore"] .scroll').scrollTop;render("explore");$('[data-v="explore"] .scroll').scrollTop=y1;return}
if(t=e.target.closest("[data-savep]")){var nm=t.dataset.savep;S.plan.push({k:"p"+nm,d:1+(S.saved++%2),m:600+S.saved*40,t:["10:00","14:00"][S.saved%2],title:nm,sub:"Saved from the hotel guide",st:"sav"});say("Saved to your stay: "+nm);return}
if(t=e.target.closest("[data-bopt]")){S.bk.o=+t.dataset.bopt;bookSheet();return}
if(t=e.target.closest("[data-bday]")){S.bk.day=+t.dataset.bday;bookSheet();return}
if(t=e.target.closest("[data-btime]")){S.bk.time=t.dataset.btime;bookSheet();return}
if(t=e.target.closest("[data-bg]")){S.bk.g=Math.max(1,Math.min(maxFor(S.bk),S.bk.g+(+t.dataset.bg)));bookSheet();return}
if(t=e.target.closest("[data-bk]")){S.bk.kids=Math.max(0,Math.min(4,S.bk.kids+(+t.dataset.bk)));bookSheet();return}
if(t=e.target.closest("#bconf")){confirmBook();return}
if(t=e.target.closest("#qclose")){closeSheet();return}
if(t=e.target.closest("[data-sug]")){ask(t.textContent);return}
if(t=e.target.closest("#scrim")){closeSheet();return}
if(t=e.target.closest("#isl")){t.classList.toggle("open");return}
});

function setNotes(on){document.body.dataset.notes=on?"on":"off";$("#nt").setAttribute("aria-pressed",on?"true":"false");fit()}

window.addEventListener("resize",fit);setNotes(window.innerWidth>1080);
var start=(location.hash||"").replace("#","");go(V[start]?start:"welcome");
})();
